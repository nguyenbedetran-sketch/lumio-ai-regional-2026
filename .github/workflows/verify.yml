name: Verify Lumio

on:
  push:
    branches:
      [main, "codex/v6-v7-upgrade", "codex/v8-evolution", "codex/v9-aurora"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and isolated database regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LUMIO_AI_ENABLED: "false"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use the tested Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Install the pinned package manager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.25.0"
          run_install: false
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Run deterministic and isolated SQLite tests
        run: pnpm test:all
      - name: Compile the production application
        run: pnpm build
      - name: Verify generated standalone native database process on Linux
        run: node scripts/test-v9-database-standalone.cjs
      - name: Check generated and source TypeScript
        run: pnpm typecheck

# This workflow intentionally has no deployment credentials or real-provider
# step. Provider quality, browser acceptance, native devices and final release
# are distinct gates in docs/v7/CHECKLIST.md.
