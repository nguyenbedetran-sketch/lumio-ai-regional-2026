<!doctype html>
<html lang="vi">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lumio AI · Xem trên điện thoại</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f1eff9;
      font: 14px system-ui;
      color: #433d63;
      display: grid;
      justify-items: center;
      gap: 20px;
      padding: 26px 12px;
    }
    header {
      text-align: center;
    }
    h1 {
      font-size: 19px;
      margin: 0 0 8px;
    }
    p {
      margin: 0;
      line-height: 1.6;
    }
    a {
      color: #6352c6;
    }
    main {
      width: 414px;
      max-width: 100%;
      padding: 12px;
      background: #242137;
      border-radius: 40px;
      box-shadow: 0 24px 65px #36295224;
    }
    iframe {
      border: 0;
      background: white;
      display: block;
      width: 390px;
      max-width: 100%;
      height: 844px;
      border-radius: 28px;
    }
    footer {
      text-align: center;
      font-size: 12px;
    }
  </style>
  <header>
    <h1>Lumio AI trên điện thoại</h1>
    <p>Bản xem bố cục 390 × 844. Cuộn và chạm để trải nghiệm.</p>
  </header>
  <main><iframe src="/" title="Lumio AI · Màn hình điện thoại"></iframe></main>
  <footer>
    <a href="/" target="_blank" rel="noopener">Mở Lumio toàn màn hình</a>
    <p>
      Đăng nhập Google/Facebook ở trang toàn màn hình. Đây là bản xem bố cục,
      không mô phỏng phần cứng điện thoại.
    </p>
  </footer>
</html>
