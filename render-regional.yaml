# Free competition preview only. Stateful data is ephemeral; no paid services.
# Set server secrets in Render Environment, never commit their values.
services:
  - type: web
    name: lumio-ai-regional
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile --prod=false && npx --yes pnpm@11.25.0 build
    startCommand: node scripts/start-regional.cjs
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: LUMIO_PUBLIC_DEMO
        value: "false"
      - key: LUMIO_COMPETITION_PREVIEW
        value: "true"
      - key: LUMIO_AI_ENABLED
        value: "true"
      - key: LUMIO_PUBLIC_INDEXING
        value: "false"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: XAI_API_KEY
        sync: false
      - key: XAI_STT_MODEL
        value: grok-voice-transcribe-2.0
      - key: XAI_VOICE
        value: eve
