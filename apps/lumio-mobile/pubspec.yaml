name: lumio_mobile
description: Lumio AI native study companion for Android and iOS.
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  crypto: ^3.0.7
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  record: ^7.1.1
  just_audio: ^0.10.6
  file_picker: ^13.1.0
  flutter_math_fork: ^0.7.4
  flutter_animate: 4.5.2
  share_plus: 13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand.png
    - assets/bell.wav
    - assets/chime.wav
